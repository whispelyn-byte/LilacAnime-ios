name: Android APK
# The Android port (docs/android-port.md): a debug APK as a workflow artifact. It is never attached to a release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: ['main', 'android-port']
    paths: ['androidApp/**', 'shared/**', '*gradle*', 'gradle/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['androidApp/**', 'shared/**', '*gradle*', 'gradle/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: sh ./gradlew --no-daemon -PincludeAndroid=true :androidApp:assembleDebug
      - name: Name the APK
        run: |
          version="$(tr -d '[:space:]' < iosApp/version.txt)"
          mkdir -p out
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "out/LilacAnime-android-${version}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-android-debug
          path: out/*.apk
          retention-days: 30
