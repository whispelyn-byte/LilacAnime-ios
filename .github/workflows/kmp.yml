name: KMP and iOS
concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      capture_previews:
        description: Capture iPhone and iPad preview screenshots
        type: boolean
        default: false
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['shared/**', 'iosApp/**', '*gradle*', 'gradle/**', '.github/workflows/kmp.yml']
  pull_request:
    paths: ['shared/**', 'iosApp/**', '*gradle*', 'gradle/**', '.github/workflows/kmp.yml']
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate authored release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: python3 iosApp/scripts/release-notes.py --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-notes.md"
      - id: plan
        shell: bash
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            tags=$(git ls-remote --tags origin 'v*')
            if printf '%s\n' "$tags" | awk -v sha="$GITHUB_SHA" '$1 == sha { found=1 } END { exit !found }'; then
              echo "The release tag validates this same commit; skipping the duplicate main build."
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  shared:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 iosApp/scripts/android-version.py --check
      - run: python3 iosApp/scripts/android-version.test.py
      - run: python3 iosApp/scripts/generate-source.test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node iosApp/scripts/ohli-capture.test.cjs
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :shared:jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-results
          path: shared/build/reports/tests/
  ios:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        id: xcode
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr ' \n' '__')" >> "$GITHUB_OUTPUT"
      - run: brew install xcodegen
      - name: Cache Kotlin Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Cache Xcode compilation
        uses: actions/cache@v4
        with:
          path: |
            iosApp/build/DerivedData/Build
            iosApp/build/DerivedData/ModuleCache.noindex
            iosApp/build/DerivedData/SDKStatCaches.noindex
          key: xcode-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('iosApp/Native/Package.swift', 'iosApp/project.yml') }}-${{ github.sha }}
          restore-keys: |
            xcode-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('iosApp/Native/Package.swift', 'iosApp/project.yml') }}-
            xcode-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
      - uses: actions/cache@v4
        with:
          path: iosApp/build/DerivedData/SourcePackages
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iosApp/Native/Package.swift') }}
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: iosApp/Native/Frameworks
          key: llama-ios-b11490-universal-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iosApp/scripts/build-native.sh') }}
      - run: sh iosApp/scripts/build-native.sh
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: iosApp/Native/Frameworks
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - run: sh iosApp/scripts/verify.sh
        env:
          CAPTURE_PREVIEWS: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_previews && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            iosApp/build/*.xcresult
            shared/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-builds
          path: iosApp/build/LilacAnime-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-SideStore
          path: iosApp/build/LilacAnime-SideStore.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.capture_previews
        with:
          name: ios-ui-preview
          path: iosApp/build/screenshots/*.png

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [shared, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LilacAnime-SideStore
          path: release
      - name: Generate SideStore source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          python3 iosApp/scripts/release-notes.py --tag "$RELEASE_TAG" --output release/notes.md
          previous_args=()
          if gh release view --repo "$RELEASE_REPO" --json tagName >/dev/null 2>&1; then
            gh release download --repo "$RELEASE_REPO" --pattern source.json --dir release/previous
            previous_args=(--previous-source release/previous/source.json)
          fi
          python3 iosApp/scripts/generate-source.py release/LilacAnime-SideStore.ipa --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --notes-file release/notes.md --output release/source.json "${previous_args[@]}"
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag --title "LilacAnime iOS $RELEASE_TAG" --notes-file release/notes.md
          else
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --notes-file release/notes.md
          fi
          gh release upload "$RELEASE_TAG" release/LilacAnime-SideStore.ipa release/source.json --repo "$RELEASE_REPO" --clobber
