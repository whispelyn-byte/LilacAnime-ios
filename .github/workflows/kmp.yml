name: KMP and iOS
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths: ['shared/**', 'iosApp/**', '*gradle*', 'gradle/**', '.github/workflows/kmp.yml']
  pull_request:
    paths: ['shared/**', 'iosApp/**', '*gradle*', 'gradle/**', '.github/workflows/kmp.yml']
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :shared:jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-results
          path: shared/build/reports/tests/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
      - run: brew install xcodegen
      - run: sh iosApp/scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            iosApp/build/*.xcresult
            shared/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-builds
          path: iosApp/build/LilacAnime-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-SideStore
          path: iosApp/build/LilacAnime-SideStore.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-preview
          path: iosApp/build/screenshots/*.png

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [shared, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LilacAnime-SideStore
          path: release
      - name: Generate SideStore source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          python3 iosApp/scripts/generate-source.py release/LilacAnime-SideStore.ipa --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --output release/source.json
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag --title "LilacAnime iOS $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/LilacAnime-SideStore.ipa release/source.json --repo "$RELEASE_REPO" --clobber
