name: LilacAnime
options:
  bundleIdPrefix: com.lilac
  deploymentTarget:
    iOS: "16.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
  libarchive:
    url: https://github.com/okferret/libarchive.git
    revision: b84d41ea6ecd1ab0b0cec6d60baa806808589cd5
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk.git
    exactVersion: 4.8.6
  LilacLocalAI:
    path: Native
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "36"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LilacAnime:
    type: application
    platform: iOS
    sources:
      - path: LilacAnime
        excludes: [Info.plist]
    info:
      path: LilacAnime/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: LilacAnime
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: 같은 Wi-Fi의 Chromecast에서 영상을 재생합니다.
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: libarchive
        product: libarchive
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - package: ZIPFoundation
      - package: GoogleCast
        product: GoogleCastDynamic
      - package: LilacLocalAI
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: LilacAnime/NativeAudio.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_ENABLE_MODULES: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lilac.anime.ios
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework LilacShared"
    preBuildScripts:
      - name: Build KMP framework
        script: |
          cd "$SRCROOT/.."
          /bin/sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  LilacAnimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LilacAnimeTests
        excludes: [Fixtures]
      - path: LilacAnimeTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LilacAnime
  LilacAnimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LilacAnimeUITests]
    dependencies:
      - target: LilacAnime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LilacAnime:
    build:
      targets:
        LilacAnime: all
        LilacAnimeTests: [test]
        LilacAnimeUITests: [test]
    test:
      targets: [LilacAnimeTests, LilacAnimeUITests]
